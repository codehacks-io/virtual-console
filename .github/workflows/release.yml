name: Release

on:
  push:
    tags:
      - 'v[0-9]*' # Matches v1, v1.0, v1.0.0, etc. (Prevents 'voldemort')

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify Version Match
        uses: okcodes/vump/.github/actions/check@main
        with:
          version: ${{ github.ref_name }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - run: node -v
      - run: npm -v
      # Need to install pnpm with this, not only with 'pnpm/action-setup' or build will fail.
      - run: npm i -g pnpm
      - run: pnpm -v

      - name: Install Dependencies
        run: pnpm install

      - name: Publish to npm
        run: |
          if [[ "${{ github.ref_name }}" == *"alpha"* ]]; then
            pnpm publish --access public --no-git-checks --tag alpha
          elif [[ "${{ github.ref_name }}" == *"beta"* ]]; then
            pnpm publish --access public --no-git-checks --tag beta
          elif [[ "${{ github.ref_name }}" == *"rc"* ]]; then
            pnpm publish --access public --no-git-checks --tag rc
          else
            pnpm publish --access public --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VC_GIT_SHA: ${{ github.sha }}

  # Rebuilds the public demo (demo/) against the version just published and
  # redeploys it to GitHub Pages. Stable releases only - a first-time
  # visitor to the demo shouldn't land on untested alpha/beta/rc behavior.
  deploy-demo:
    needs: publish
    if: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - run: npm i -g pnpm

      - name: Install demo dependencies
        working-directory: demo
        run: pnpm install --frozen-lockfile

      # demo/ floats on @codehacks/virtual-console@latest for local dev, but
      # the demo published under this tag must be pinned to the exact
      # version this same workflow run just published - not whatever
      # "latest" happens to resolve to.
      - name: Pin the demo to the version just published
        working-directory: demo
        run: pnpm add "@codehacks/virtual-console@${GITHUB_REF_NAME#v}"

      - name: Build demo
        working-directory: demo
        run: pnpm run build
        env:
          GITHUB_PAGES_BASE: /virtual-console/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
