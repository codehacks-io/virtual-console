name: Release

on:
  push:
    tags:
      - 'v[0-9]*' # Matches v1, v1.0, v1.0.0, etc. (Prevents 'voldemort')

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@codehacks-io'

      - name: Install Dependencies
        run: pnpm install

      - name: Verify Version Match
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          
          echo "Tag Version: $TAG_VERSION"
          echo "Package Version: $PACKAGE_VERSION"
          
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Version mismatch! Tag is v$TAG_VERSION but package.json is $PACKAGE_VERSION"
            exit 1
          fi
          echo "Versions match. Proceeding..."

      - name: Build
        run: pnpm build

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Switch registry to npm (Commented out for now)
      # - name: Setup Node.js for npm
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'
      #     registry-url: 'https://registry.npmjs.org'

