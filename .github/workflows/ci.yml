name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install pnpm
      uses: pnpm/setup@v2
      with:
        # Version comes from the "packageManager" field in package.json -
        # one declared source of truth instead of a second copy here that
        # can drift out of sync with what's pinned for local dev.
        install: false

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '26'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install

    - name: Lint
      run: pnpm lint

    - name: Typecheck
      run: pnpm typecheck

    - name: Test
      run: pnpm test

    - name: Build
      run: pnpm build

    - name: Build Local Examples
      run: pnpm build:local

    - name: Build Demo
      run: pnpm build:demo
